[build-system]
# 77 is the first release that understands SPDX `license` and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "will-it-run-local"
dynamic = ["version"]
description = "Predict and tune local LLM inference from measured hardware limits, not nameplate specs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Cusack" }]
keywords = ["llama.cpp", "gguf", "llm", "inference", "benchmark", "moe"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Benchmark",
]
# No runtime dependencies on purpose: this tool runs on machines that are
# already short on memory, and it should never be the reason an environment
# breaks. numpy is used only as a fallback if no C compiler is present.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "setuptools>=77"]

[project.scripts]
wirl = "wirl.cli:main"

[project.urls]
Homepage = "https://github.com/John-Cusack/will-it-run-local"
Issues = "https://github.com/John-Cusack/will-it-run-local/issues"

[tool.setuptools.dynamic]
version = { attr = "wirl.__version__" }

[tool.setuptools.packages.find]
include = ["wirl", "wirl.*"]

# Keep source for development installs and bundle the probe in platform wheels.
[tool.setuptools.package-data]
"wirl.csrc" = ["*.c"]
wirl = ["_bin/membw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["wirl"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.cibuildwheel]
# The executable has no Python ABI: one build covers every supported Python.
build = "cp312-manylinux_*"
test-extras = ["dev"]
test-command = [
    "python {project}/tools/check_installed_probe.py --measure",
    "pytest -q {project}/tests",
]
environment = { WIRL_REQUIRE_PROBE = "1" }

[tool.cibuildwheel.linux]
archs = ["native"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
