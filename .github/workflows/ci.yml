name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml; 3.13 catches anything
        # that relies on removed behaviour.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Tests
        # No GPU, no model files, and no network: the suite builds its own
        # synthetic GGUFs and mocks every server launch.
        run: pytest -q

      - name: Bandwidth probe compiles
        run: |
          python - <<'PY'
          from wirl.membw import build_probe
          p = build_probe(force=True)
          assert p, "bandwidth probe failed to build"
          print("built", p)
          PY

      - name: CLI is importable and self-describing
        run: |
          python -m wirl --help
          python -m wirl --version
          for c in auto probe inspect plan recommend doctor check-draft find-draft bandwidth tune; do
            python -m wirl "$c" --help > /dev/null || exit 1
          done
