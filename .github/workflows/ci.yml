name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml; 3.14 catches anything
        # that relies on removed behaviour.
        python-version: ["3.9", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Tests
        # No GPU, no model files, and no network: the suite builds its own
        # synthetic GGUFs and mocks every server launch.
        run: pytest -q

      - name: Bandwidth probe compiles
        run: |
          python - <<'PY'
          from wirl.membw import build_probe
          p = build_probe(force=True)
          assert p, "bandwidth probe failed to build"
          print("built", p)
          PY

      - name: CLI is importable and self-describing
        run: |
          python -m wirl --help
          python -m wirl --version
          for c in auto probe inspect plan recommend doctor check-draft find-draft bandwidth tune; do
            python -m wirl "$c" --help > /dev/null || exit 1
          done

  package:
    # The job above tests the checkout. This tests what pip actually installs:
    # the wheel must carry the probe's C source, and the sdist must carry
    # everything needed to run the suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Tests from the sdist, against the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          for wheel in dist/*.whl; do
            "$RUNNER_TEMP/venv/bin/pip" install "${wheel}[dev]"
          done
          mkdir "$RUNNER_TEMP/sdist"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
          # Run from outside the source tree so `wirl` can only resolve to
          # the installed wheel.
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import wirl, sys; assert 'site-packages' in wirl.__file__, wirl.__file__"
          "$RUNNER_TEMP/venv/bin/pytest" -q -p no:cacheprovider sdist/tests
          "$RUNNER_TEMP/venv/bin/python" -c "from wirl.membw import build_probe; assert build_probe(force=True)"
          "$RUNNER_TEMP/venv/bin/wirl" --version

  wheels:
    # Native runners keep the ARM probe test meaningful and avoid emulation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build, repair and test platform wheel
        run: |
          python -m pip install cibuildwheel==4.2.1 twine
          cibuildwheel --platform linux --output-dir wheelhouse
          twine check --strict wheelhouse/*

      - name: Measure from a wheel in a container without a compiler
        run: |
          docker run --rm --network none \
            -v "$PWD/wheelhouse:/wheels:ro" \
            -v "$PWD/tools:/checks:ro" \
            python:3.12-slim-bookworm sh -eu -c '
              python -m pip install --no-index --no-deps /wheels/*.whl
              python -c "import shutil; assert not any(shutil.which(cc) for cc in (\"cc\", \"gcc\", \"clang\"))"
              python /checks/check_installed_probe.py --measure
            '

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
