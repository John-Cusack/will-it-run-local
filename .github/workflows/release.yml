name: release

# Push a tag like v0.1.0 to publish. Uses PyPI trusted publishing, so no API
# token is stored anywhere: PyPI is configured once to trust this workflow.

on:
  push:
    tags: ["v*"]

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Tag matches the package version
        run: |
          have="$(python -c 'import wirl; print(wirl.__version__)')"
          if [ "v$have" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match wirl.__version__ $have" >&2
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist
          twine check --strict dist/*

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Check complete release distributions
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
